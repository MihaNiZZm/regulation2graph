version: '3.8'

services:
  neo4j:
    image: neo4j:5.14.0
    container_name: reg2graph-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_security_auth__enabled=false
    ports:
      - "7474:7474"  # HTTP (Browser)
      - "7687:7687"  # Bolt (Driver connection)
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  neo4j_data:
